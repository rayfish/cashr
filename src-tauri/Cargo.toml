[workspace]

[package]
name = "cashr"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "cashr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
futures = "0.3"
yawc = "0.3"
cdk = { version = "=0.18.0", default-features = false, features = ["wallet", "npubcash"] }
base64 = "0.22"
cdk-sqlite = { version = "=0.18.0", default-features = false, features = ["wallet", "sqlcipher"] }
sha2 = "0.10"
bip39 = { version = "2.2", features = ["zeroize"] }
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lightning-invoice = "0.34"
url = "2"
macos-native = { path = "../crates/macos-native" }
nostr = { version = "0.45", features = ["std", "os-rng", "nip06", "nip04", "nip44", "nip46", "nip49"] }
relay-transport = { path = "../crates/relay-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
signer-core = { path = "../crates/signer-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
