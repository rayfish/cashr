[workspace]
resolver = "2"
members = ["crates/macos-native", "crates/relay-transport", "crates/signer-core"]
# The Tauri app needs GTK/WebKit headers to build, which a Linux dev box here
# does not have. Keeping it out of this workspace means cargo build, clippy and
# test stay green on every machine; the app has its own workspace and is built
# on the Mac.
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
getrandom = "0.4"
nostr = { version = "0.45", features = ["std", "os-rng", "nip04", "nip44", "nip46", "nip49"] }
# Match CDK's SQLite binding: only one libsqlite3-sys can be linked by the app.
rusqlite = { version = "0.31", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
url = "2"
yawc = "0.3"
zeroize = { version = "1", features = ["derive"] }
