name: macOS beta DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: github.event.created == true && github.event.deleted == false
    name: Self-sign beta (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See .github/SIGNING.md."
              exit 1
            fi
          done

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Install build tools
        run: |
          brew install openssl@3
          cargo install tauri-cli --locked --version 2.11.4

      # Tauri's certificate importer expects an Apple team identity, so import
      # our self-signed beta identity explicitly instead.
      - name: Import beta signing identity
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Trust beta certificate on the build runner
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$HOME/Library/Keychains/signing_temp.keychain-db"
          certificate="$RUNNER_TEMP/cashr-signing.pem"
          trap 'rm -f "$certificate"' EXIT
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$keychain" > "$certificate"
          # Trust only for code signing on this disposable runner.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APPLE_SIGNING_IDENTITY"

      - name: Build self-signed beta
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: cargo tauri build --locked --target aarch64-apple-darwin

      - name: Verify app and DMG
        run: |
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Cashr.app"
          shopt -s failglob
          for dmg in "$bundle"/dmg/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            hdiutil verify "$dmg"
          done
          cd "$bundle/dmg"
          shasum -a 256 ./*.dmg > SHA256SUMS

      - name: Upload signed DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cashr-beta-macOS-Apple-Silicon-${{ github.sha }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Cashr $RELEASE_TAG (beta)" \
            --notes-file .github/RELEASE_NOTES.md \
            "$bundle"/*.dmg "$bundle/SHA256SUMS"
