<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Byrgi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">
        <span id="lock-dot" class="dot"></span>
        <select id="account-picker" class="picker" title="Active account"></select>
      </span>
      <button id="lock-toggle" class="icon" title="Unlock">Unlock</button>
      <button id="pin-toggle" class="icon" title="Keep the window open" aria-pressed="false">
        Pin
      </button>
      <button id="close" class="icon" title="Close">&times;</button>
    </header>

    <section id="prompts" class="prompts" hidden></section>

    <section id="unlock" class="unlock" hidden>
      <div id="unlock-title" class="unlock-title"></div>
      <div id="unlock-hint" class="empty"></div>
      <button id="unlock-touch-id" class="primary wide" type="button" hidden>
        Unlock with Touch ID
      </button>
      <form id="unlock-form" class="row">
        <input
          id="unlock-passphrase"
          type="password"
          placeholder="Passphrase"
          autocomplete="current-password"
        />
        <button id="unlock-go" class="primary" type="submit">Unlock</button>
      </form>
      <label id="unlock-remember-row" class="check" hidden>
        <input id="unlock-remember" type="checkbox" />
        Unlock with Touch ID next time
      </label>
      <div id="unlock-error" class="empty" hidden></div>
    </section>

    <section id="keychain-leftover" class="unlock" hidden>
      <div class="empty">
        Your keys are in encrypted files now. The old Keychain copies are still
        there, in the clear.
      </div>
      <button id="forget-keychain" class="danger">Delete the Keychain copies</button>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-tab="home">Account</button>
      <button class="tab" data-tab="clients">Clients</button>
      <button class="tab" data-tab="rules">Rules</button>
      <button class="tab" data-tab="activity">Activity</button>
    </nav>

    <main id="scroll">
      <section id="tab-home" class="panel is-active">
        <div id="account-card" class="card stack"></div>

        <h2>Pair a client</h2>
        <div class="split">
          <button id="pair-bunker" class="primary">Copy bunker URI</button>
          <button id="pair-paste">Paste nostrconnect URI</button>
        </div>
        <div id="pair-form" class="row" hidden>
          <input id="pair-uri" type="text" placeholder="nostrconnect://…" spellcheck="false" />
          <button id="pair-client" class="primary">Accept</button>
        </div>
        <output id="pair-output" class="output" hidden></output>

        <h2>Relays</h2>
        <div id="relay-list" class="list"></div>
        <div class="row">
          <input id="relay-url" type="text" placeholder="wss://relay.example" spellcheck="false" />
          <button id="relay-add">Add</button>
        </div>

        <div class="head">
          <h2>Accounts</h2>
          <button
            id="account-add"
            class="icon plus"
            title="Add an account"
            aria-expanded="false"
            aria-controls="account-new"
          >
            +
          </button>
        </div>
        <div id="account-list" class="list"></div>
        <div id="account-new" hidden>
          <div class="row">
            <input id="account-label" type="text" placeholder="Label" />
            <button id="account-create" class="primary">New key</button>
          </div>
          <div class="row">
            <input
              id="account-secret"
              type="password"
              placeholder="nsec1… or hex"
              spellcheck="false"
            />
            <button id="account-import">Import</button>
          </div>
          <p class="hint">
            An imported key is encrypted with your passphrase and written to a
            key file. It never goes in the database.
          </p>
        </div>

        <h2>Unlocking</h2>
        <p id="touch-id-state" class="hint"></p>
        <button id="forget-touch-id" class="danger" hidden>
          Stop unlocking with Touch ID
        </button>
      </section>

      <section id="tab-clients" class="panel">
        <div id="client-list" class="list"></div>
      </section>

      <section id="tab-rules" class="panel">
        <select id="rule-client" class="picker wide"></select>
        <div id="rule-list" class="list"></div>
      </section>

      <section id="tab-activity" class="panel">
        <div id="activity-list" class="list"></div>
        <button id="activity-more" class="ghost wide" hidden>Load more</button>
      </section>
    </main>

    <footer class="bar foot">
      <span id="relay-summary" class="muted">no relays</span>
      <span class="grow"></span>
      <span id="pending-summary" class="muted"></span>
    </footer>

    <div id="toast" class="toast" hidden></div>
    <script src="main.js"></script>
  </body>
</html>
